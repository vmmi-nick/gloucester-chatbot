# Blueprint for the Gloucester County constituent chatbot backend.
# One web service only. The verified index lives in data/*.json inside the
# repo, so no database service is needed for the test deployment.
# Set MODEL_API_KEY in the Render dashboard (Environment). Never commit it.
# NOT DEPLOYED: this blueprint is prepared only. Deployment needs Nick's
# separate go-ahead, the same gate used for the Parsippany bot.
services:
  - type: web
    name: gloucester-chatbot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODEL_API_KEY
        sync: false
